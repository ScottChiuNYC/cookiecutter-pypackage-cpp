[tool.poetry]
name = "{{ cookiecutter.module_name }}"
version = "{{ cookiecutter.version }}"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

include = [
    # Source files for C extensions must be included in the source distribution.
    { path = "cpp/bindings/*.*", format = "sdist" },
    { path = "cpp/include/{{ cookiecutter.module_name }}_core/*.*", format = "sdist" },
    { path = "cpp/src/*.*", format = "sdist" },
    # C extensions must be included in the wheel distribution.
    { path = "src/{{ cookiecutter.module_name }}/*.pyd", format = "wheel" },
    { path = "src/{{ cookiecutter.module_name }}/*.so", format = "wheel" },
]
exclude = [
    "cpp/*",
]

[tool.poetry.build]
generate-setup-file = false
script = "build.py"

[tool.poetry.dependencies]
python = "{{ cookiecutter.python_version }}"


[build-system]
requires = ["poetry-core", "cmake", "ninja"]
build-backend = "poetry.core.masonry.api"
