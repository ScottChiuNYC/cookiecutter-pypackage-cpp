name: Build and Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-and-test.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'build.py'
      - 'cnb.bat'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - 'vcpkg-ports/**'
      - 'cpp/**'
      - 'examples/cpp/**'
      - 'src/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: build-test-{% raw %}${{ github.workflow }}-${{ github.ref }}{% endraw %}
  cancel-in-progress: true

env:
  VCPKG_ROOT: {% raw %}${{ github.workspace }}{% endraw %}/vcpkg
  VCPKG_DISABLE_METRICS: 1
  POETRY_NO_INTERACTION: 1
  PYTHONPATH: {% raw %}${{ github.workspace }}{% endraw %}/src

jobs:
  build-and-test:
    name: {% raw %}${{ matrix.name }}{% endraw %}
    runs-on: {% raw %}${{ matrix.os }}{% endraw %}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            configure_preset: linux-vcpkg-release
            build_preset: linux-release
            test_preset: linux-release-tests
          - name: Windows
            # The generated Windows preset intentionally targets Visual Studio 2022.
            os: windows-2022
            configure_preset: windows-vcpkg
            build_preset: windows-release
            test_preset: windows-release-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '{{ cookiecutter.python_version.replace(">=", "") }}'
          cache: pip

      - name: Read vcpkg baseline
        id: vcpkg-baseline
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          configuration = json.loads(
              Path("vcpkg-configuration.json").read_text(encoding="utf-8")
          )
          baseline = configuration["default-registry"]["baseline"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"sha={baseline}\n")

      - name: Check out pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: {% raw %}${{ steps.vcpkg-baseline.outputs.sha }}{% endraw %}
          path: vcpkg
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap vcpkg on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Install Python dependencies with Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry>=1.8,<3"
          poetry install --no-root --no-ansi

      - name: Configure CMake
        run: cmake --preset "{% raw %}${{ matrix.configure_preset }}{% endraw %}"

      - name: Verify pkgconf was neither installed nor acquired
        shell: python
        run: |
          import os
          from pathlib import Path

          installed = sorted(Path("build").glob("*/vcpkg_installed/vcpkg/info/pkgconf_*"))
          downloads = Path(os.environ["VCPKG_ROOT"]) / "downloads"
          acquired = []
          for directory in (downloads, downloads / "tools"):
              if not directory.exists():
                  continue
              acquired.extend(
                  path for path in directory.iterdir()
                  if path.name.lower() == "pkgconf"
                  or path.name.lower().startswith("pkgconf-")
              )
          acquired = sorted(acquired)

          if installed or acquired:
              raise SystemExit(
                  f"pkgconf unexpectedly present; installed={installed}, acquired={acquired}"
              )

          print("Confirmed: the local gtest overlay was configured without pkgconf.")

      - name: Build C++ and pybind module
        run: cmake --build --preset "{% raw %}${{ matrix.build_preset }}{% endraw %}"

      - name: Run CTest
        run: ctest --preset "{% raw %}${{ matrix.test_preset }}{% endraw %}"

      - name: Run Pytest
        run: poetry run pytest tests/python
